# Mosquitto MQTT Broker — FdctMonSys
# Rede interna com autenticação por usuário/senha.
# O password_file é gerado em runtime pelo docker-compose a partir do .env.

listener 1883
allow_anonymous false
password_file /tmp/mosquitto_passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
