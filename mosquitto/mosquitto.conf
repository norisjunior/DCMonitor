# Autenticação e autorização por cliente, gerenciadas em tempo de execução
# pelo plugin dynamic security (credenciais no diretório do host
# MQTT_SEGURANCA_DIR). Nenhuma conexão anônima é aceita, em nenhuma porta.
per_listener_settings false
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/seguranca/dynamic-security.json

# Dispositivos: somente TLS. Certificados gerados por scripts/gerar_certificados.sh.
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Interna: somente rede Docker (não publicada no host). Node-RED se autentica
# com MQTT_ADMIN_USER, que também administra as credenciais das placas.
listener 1884 0.0.0.0

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
