# Porta dos dispositivos: publicada no host e sempre autenticada.
per_listener_settings true
listener 1883 0.0.0.0
allow_anonymous false
password_file /tmp/mosquitto_passwd

# Porta interna: disponível somente na rede Docker para Node-RED e n8n.
listener 1884 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
