<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOC — Monitoramento Sala Cofre</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #c9d1d9;
    }

    #status-badge {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      text-transform: uppercase;
    }
    #status-badge.online  { background: #1a4731; color: #3fb950; border: 1px solid #3fb950; }
    #status-badge.offline { background: #4d1a1a; color: #f85149; border: 1px solid #f85149; }
    #status-badge.loading { background: #2d333b; color: #8b949e; border: 1px solid #8b949e; }

    #offline-banner {
      display: none;
      background: #4d1a1a;
      border-bottom: 2px solid #f85149;
      color: #f85149;
      text-align: center;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      align-content: start;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 0.75rem;
      padding: 1.75rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8b949e;
    }

    .card-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .card-unit {
      font-size: 1.2rem;
      font-weight: 400;
      color: #8b949e;
      margin-left: 0.3rem;
    }

    .card-sub {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 0.25rem;
    }

    /* Cores por tipo */
    .card.temperatura .card-value { color: #ffa657; }
    .card.umidade     .card-value { color: #58a6ff; }
    .card.fumaca.alerta  .card-value { color: #f85149; }
    .card.fumaca.normal  .card-value { color: #3fb950; }
    .card.presenca.alerta .card-value { color: #f85149; }
    .card.presenca.normal .card-value { color: #3fb950; }
    .card.distancia  .card-value { color: #d2a8ff; }

    .card.alerta { border-color: #f85149; background: #1a0d0d; }

    footer {
      padding: 0.75rem 2rem;
      background: #161b22;
      border-top: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <header>
    <h1>NOC &mdash; Monitoramento Sala Cofre</h1>
    <span id="status-badge" class="loading">Conectando...</span>
  </header>

  <div id="offline-banner">
    &#9888; Dispositivo sem comunicação há mais de {{ offline_threshold }} min
  </div>

  <main>
    <div class="card temperatura">
      <span class="card-label">Temperatura</span>
      <div>
        <span class="card-value" id="val-temp">—</span>
        <span class="card-unit">°C</span>
      </div>
    </div>

    <div class="card umidade">
      <span class="card-label">Umidade</span>
      <div>
        <span class="card-value" id="val-umid">—</span>
        <span class="card-unit">%</span>
      </div>
    </div>

    <div class="card fumaca normal" id="card-fumaca">
      <span class="card-label">Fumaça</span>
      <div>
        <span class="card-value" id="val-fumaca">—</span>
      </div>
    </div>

    <div class="card presenca normal" id="card-presenca">
      <span class="card-label">Presença (fora de horário)</span>
      <div>
        <span class="card-value" id="val-presenca">—</span>
      </div>
      <span class="card-sub">Alerta ativo entre 22h e 6h</span>
    </div>

    <div class="card distancia">
      <span class="card-label">Distância à porta</span>
      <div>
        <span class="card-value" id="val-distancia">—</span>
        <span class="card-unit">cm</span>
      </div>
    </div>
  </main>

  <footer>
    <span id="footer-device">Dispositivo: —</span>
    <span id="footer-ts">Última medição: —</span>
  </footer>

  <script>
    const POLL_INTERVAL_MS = 5000;

    function formataTimestamp(iso) {
      const d = new Date(iso);
      return d.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
    }

    function atualiza(dados) {
      const badge  = document.getElementById('status-badge');
      const banner = document.getElementById('offline-banner');

      if (!dados.online) {
        badge.textContent = 'OFFLINE';
        badge.className   = 'offline';
        banner.style.display = 'block';
      } else {
        badge.textContent = 'ONLINE';
        badge.className   = 'online';
        banner.style.display = 'none';
      }

      if (!dados.registro) return;
      const r = dados.registro;

      document.getElementById('val-temp').textContent =
        r.temperatura !== null ? r.temperatura : '—';
      document.getElementById('val-umid').textContent =
        r.umidade !== null ? r.umidade : '—';

      // Fumaça
      const cardFumaca = document.getElementById('card-fumaca');
      document.getElementById('val-fumaca').textContent =
        r.fumaca ? 'FUMAÇA!' : 'Normal';
      cardFumaca.className = 'card fumaca ' + (r.fumaca ? 'alerta' : 'normal');

      // Presença notificável
      const cardPresenca = document.getElementById('card-presenca');
      document.getElementById('val-presenca').textContent =
        r.presenca_notificavel ? 'ALERTA!' : 'Normal';
      cardPresenca.className = 'card presenca ' + (r.presenca_notificavel ? 'alerta' : 'normal');

      document.getElementById('val-distancia').textContent =
        r.distancia !== null ? r.distancia : '—';

      document.getElementById('footer-device').textContent =
        'Dispositivo: ' + r.device_id;
      document.getElementById('footer-ts').textContent =
        'Última medição: ' + formataTimestamp(r.timestamp);
    }

    function poll() {
      fetch('/api/status')
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(atualiza)
        .catch(err => {
          console.error('Falha ao buscar /api/status:', err);
          const badge = document.getElementById('status-badge');
          badge.textContent = 'ERRO';
          badge.className   = 'offline';
          document.getElementById('offline-banner').style.display = 'block';
        });
    }

    poll();
    setInterval(poll, POLL_INTERVAL_MS);
  </script>

</body>
</html>
