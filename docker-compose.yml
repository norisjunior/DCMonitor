name: dcmonitor

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      # Dispositivos, somente TLS. A porta 1884 (interna) não é publicada.
      - "${BIND_ADDRESS:-0.0.0.0}:8883:8883"
    environment:
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-node-red}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?MQTT_ADMIN_PASSWORD obrigatorio}
    command: ["sh", "/mosquitto/config/iniciar.sh"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
      - ./mosquitto/iniciar.sh:/mosquitto/config/iniciar.sh:ro,Z
      # Gerados por scripts/gerar_certificados.sh.
      - ${MQTT_CERTS_DIR:-./pki/mosquitto}:/mosquitto/certs:ro,Z
      # Credenciais das placas (só hashes), no host para backup direto.
      # Crie antes: install -d -o 1883 -g 1883 ./mqtt-seguranca
      - ${MQTT_SEGURANCA_DIR:-./mqtt-seguranca}:/mosquitto/seguranca:Z
      - mosquitto_data:/mosquitto/data
    healthcheck:
      # Login lido de /root/.config/mosquitto_pub (criado pelo iniciar.sh), fora do ps.
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1884", "-t", "dcmonitor/health", "-m", "ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8086:8086"
    environment:
      INFLUXD_HTTP_BIND_ADDRESS: ":8086"
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:?INFLUXDB_ADMIN_USER obrigatorio}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD obrigatorio}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN obrigatorio}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-dcmonitor}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-fdctmon}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-2160h}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 10

  node-red:
    build: ./node-red
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:1880:1880"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      NODE_RED_LISTEN_ADDRESS: 0.0.0.0
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?NODE_RED_CREDENTIAL_SECRET obrigatorio}
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER:-admin}
      NODE_RED_ADMIN_PASSWORD_HASH: ${NODE_RED_ADMIN_PASSWORD_HASH:?NODE_RED_ADMIN_PASSWORD_HASH obrigatorio}
      CADASTRO_ADMIN_USER: ${CADASTRO_ADMIN_USER:-cadastro}
      CADASTRO_ADMIN_PASSWORD_HASH: ${CADASTRO_ADMIN_PASSWORD_HASH:?CADASTRO_ADMIN_PASSWORD_HASH obrigatorio}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG:-dcmonitor}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-fdctmon}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN obrigatorio}
      ZABBIX_SERVER: ${ZABBIX_SERVER:-10.32.8.57}
      ZABBIX_PORT: ${ZABBIX_PORT:-10051}
      # Segundo servidor Zabbix. Definido como vazio no .env, o envio é desligado.
      ZABBIX_SERVER_2: ${ZABBIX_SERVER_2-10.32.8.69}
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-node-red}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?MQTT_ADMIN_PASSWORD obrigatorio}
      # Faz o Node.js confiar na CA do DCMonitor (healthcheck em HTTPS).
      NODE_EXTRA_CA_CERTS: /data/tls/ca.crt
    volumes:
      - node_red_data:/data
      # Certificado HTTPS da porta 1880, gerado por scripts/gerar_certificados.sh.
      - ${NODERED_CERTS_DIR:-./pki/node-red}:/data/tls:ro,Z
      # Cadastro de dispositivos editado pela página /admin/. Diretório do host,
      # gravável pelo UID 1000 do container, para backup direto pelo host.
      - ${CADASTRO_DIR:-./cadastro}:/data/cadastro:Z
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://localhost:1880/auth/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  n8n:
    build: ./n8n
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:5678:5678"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY obrigatorio}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: child_process
      ZABBIX_SERVER: ${ZABBIX_SERVER:-10.32.8.57}
      ZABBIX_PORT: ${ZABBIX_PORT:-10051}
      ZABBIX_HOST_NAME: ${ZABBIX_HOST_NAME:-SALA COFRE}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.1
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:3000:3000"
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD obrigatorio}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG:-dcmonitor}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-fdctmon}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN obrigatorio}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  mosquitto_data:
  influxdb_data:
  influxdb_config:
  node_red_data:
  n8n_data:
  grafana_data:
