name: dcmonitor

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:1883:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME obrigatorio}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD obrigatorio}
    command:
      - sh
      - -c
      - |
        rm -f /tmp/mosquitto_passwd
        mosquitto_passwd -b -c /tmp/mosquitto_passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /tmp/mosquitto_passwd
        chmod 0640 /tmp/mosquitto_passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1884", "-t", "dcmonitor/health", "-m", "ok"]
      interval: 30s
      timeout: 5s
      retries: 3

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8086:8086"
    environment:
      INFLUXD_HTTP_BIND_ADDRESS: ":8086"
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:?INFLUXDB_ADMIN_USER obrigatorio}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD obrigatorio}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN obrigatorio}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-dcmonitor}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-fdctmon}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-2160h}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 10

  node-red:
    build: ./node-red
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:1880:1880"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      NODE_RED_LISTEN_ADDRESS: 0.0.0.0
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?NODE_RED_CREDENTIAL_SECRET obrigatorio}
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER:-admin}
      NODE_RED_ADMIN_PASSWORD_HASH: ${NODE_RED_ADMIN_PASSWORD_HASH:?NODE_RED_ADMIN_PASSWORD_HASH obrigatorio}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG:-dcmonitor}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-fdctmon}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN obrigatorio}
    volumes:
      - node_red_data:/data
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1880/auth/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  n8n:
    build: ./n8n
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:5678:5678"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY obrigatorio}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: child_process
      ZABBIX_SERVER: ${ZABBIX_SERVER:-10.32.8.57}
      ZABBIX_PORT: ${ZABBIX_PORT:-10051}
      ZABBIX_HOST_NAME: ${ZABBIX_HOST_NAME:-SALA COFRE}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.1
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:3000:3000"
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD obrigatorio}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG:-dcmonitor}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-fdctmon}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN obrigatorio}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  mosquitto_data:
  influxdb_data:
  influxdb_config:
  node_red_data:
  n8n_data:
  grafana_data:
